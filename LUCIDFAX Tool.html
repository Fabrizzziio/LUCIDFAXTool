<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUCIDFAX Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fff;--fg:#000;--mut:#555;--ln:#ddd;--c1:#eee;--c2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:11px/1.4 'Space Mono',ui-monospace,Menlo,monospace;font-weight:400;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--fg)}
h1{font-size:11px;margin:0;font-weight:400}
header span{color:var(--mut)}
main{flex:1;display:flex;min-height:0}
aside{width:280px;flex:none;overflow-y:auto;border-right:1px solid var(--fg)}
details{border-bottom:1px solid var(--fg)}
summary{cursor:pointer;padding:8px 12px;font-weight:400;display:flex;justify-content:space-between;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+'}details[open] summary::after{content:'–'}
.b{padding:2px 12px 10px}
.r{display:grid;grid-template-columns:88px 1fr 30px;gap:8px;align-items:center;margin:6px 0}
.r label{color:var(--mut)}
.r output{text-align:right;font-size:10px}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:0;border-radius:0;padding:2px 0;min-width:0;outline:0}
select,input[type=number]{border-bottom:1px solid var(--fg)}
.r select,.r input[type=number],.r input[type=color]{grid-column:2/4}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:linear-gradient(var(--fg),var(--fg)) center/100% 1px no-repeat;margin:0;padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--fg);cursor:grab}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--fg);cursor:grab}
input[type=color]{-webkit-appearance:none;appearance:none;width:14px;height:14px;padding:0;border:1px solid var(--fg);border-radius:0;cursor:pointer;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:0}
input[type=color]::-moz-color-swatch{border:0;border-radius:0}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:auto;height:auto;margin:0;padding:0;cursor:pointer;color:var(--mut)}
input[type=checkbox]::after{content:'off'}input[type=checkbox]:checked{color:var(--fg)}input[type=checkbox]:checked::after{content:'on'}
button{cursor:pointer;border:1px solid var(--fg);padding:5px 8px}
button:hover{background:var(--fg);color:var(--bg)}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#area{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:16px;background:var(--bg)}
canvas{display:block;outline:1px solid var(--fg);cursor:crosshair;touch-action:none;background:repeating-conic-gradient(var(--c1) 0 25%,var(--c2) 0 50%) 0 0/16px 16px}
@media(max-width:760px){main{flex-direction:column-reverse}aside{width:auto;height:46%;border-right:0;border-top:1px solid var(--fg)}}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:9px 12px;border-top:1px solid var(--fg)}
footer .f{display:flex;align-items:center;gap:8px;color:var(--mut)}
footer .f input[type=range]{width:90px}footer .f input[type=number]{width:40px;text-align:right}
footer #sc{flex:1;min-width:140px;width:auto}
footer output{color:var(--fg);min-width:30px}
#desc{padding:10px 12px;color:var(--mut);border-bottom:1px solid var(--fg);margin:0}
#clr{display:block;width:calc(100% - 24px);margin:10px 12px;background:var(--fg);color:var(--bg);padding:9px;font-size:12px}
#clr:hover{background:var(--bg);color:var(--fg)}
#don{color:var(--fg);text-decoration:none;border:1px solid var(--fg);padding:3px 10px}#don:hover{background:var(--fg);color:var(--bg)}
.ly{display:flex;align-items:center;gap:4px;padding:3px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.ly.a{background:var(--fg);color:var(--bg)}.ly.a button{color:var(--bg)}.ly span{flex:1}
.ly button{border:0;padding:0 4px;background:none;color:var(--fg)}.ly button:hover{text-decoration:underline;background:none}

[data-theme=black]{--bg:#000;--fg:#fff;--mut:#aaa;--ln:#333;--c1:#1c1c1c;--c2:#000;color-scheme:dark}
[data-theme=grey60]{--bg:#666;--fg:#fff;--mut:#ddd;--ln:#7a7a7a;--c1:#707070;--c2:#666;color-scheme:dark}
[data-theme=grey80]{--bg:#333;--fg:#fff;--mut:#bbb;--ln:#4a4a4a;--c1:#3d3d3d;--c2:#333;color-scheme:dark}
#th{width:44px;flex:none;border-left:1px solid var(--fg);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0}
#th span{writing-mode:vertical-rl;color:var(--mut);letter-spacing:.05em}
#th button{width:18px;height:18px;padding:0;border:1px solid var(--fg)}
#th button.on{outline:1px solid var(--fg);outline-offset:3px}
#cw{position:relative;line-height:0}
#cw.mh::before,#cw.mv::after{content:'';position:absolute;pointer-events:none;opacity:.45}
#cw.mh::before{left:50%;top:0;bottom:0;border-left:1px dashed var(--fg)}
#cw.mv::after{top:50%;left:0;right:0;border-top:1px dashed var(--fg)}
@media(max-width:760px){#th{width:auto;flex-direction:row;border-left:0;border-bottom:1px solid var(--fg);padding:8px 12px}#th span{writing-mode:horizontal-tb}}
</style></head><body>
<header><h1>LUCIDFAX Tool</h1><span><span id="info"></span> &nbsp; <a id="don" href="https://paypal.me/studiomarseca" target="_blank" rel="noopener">Donate</a></span></header>
<main><aside><p id="desc">Create visuals however you like, built from your own strokes. Stack layers into a composition, animate them, then export as PNG, JPG, PDF or video.</p><button id="clr">Clear canvas</button><div id="p"></div></aside><div id="area"><div id="cw"><canvas id="c"></canvas></div></div><nav id="th"><span>Theme</span><button data-t="white" style="background:#fff" title="White"></button><button data-t="grey60" style="background:#666" title="Grey 60%"></button><button data-t="grey80" style="background:#333" title="Grey 80%"></button><button data-t="black" style="background:#000" title="Black"></button></nav></main>
<footer id="F">
<button id="pl">Play</button>
<input type="range" id="sc" min="0" max="1000" value="0"><output id="tm">0.0s</output>
<span class="f">Motion<select data-id="amv"><option>None</option><option>Float</option><option>Breathe</option><option>Glitch</option><option>Distortion</option><option>Rotating light</option></select></span>
<span class="f">Cycles<input type="range" data-id="acy" min="1" max="8" value="1"><output>1</output></span>
<span class="f">Intensity<input type="range" data-id="aam" min="1" max="100" value="60"><output>60</output></span>
<span class="f">Duration s<input type="number" data-id="adu" min="1" max="30" value="4"></span>
<button id="vx">Export video</button>
</footer>

    M.width=W;M.height=H;
    const G=16,cw=Math.ceil(W/G),chh=Math.ceil(H/G),fr=Math.floor(p/6.2832*24)|0,am=.09*Math.min(W,H)*k;
    const hs=(a,b,cc)=>{let t=(l.seed^a*374761393^b*668265263^cc*2246822519)>>>0;t=Math.imul(t^t>>>13,1274126177)>>>0;return((t^t>>>16)>>>0)/4294967296};
    for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){
      const sx0=gx*cw,sy0=gy*chh,w=Math.min(cw,W-sx0),h2=Math.min(chh,H-sy0);
      if(w<=0||h2<=0)continue;
      const on=hs(gx,gy,fr)<.1+.5*k; // only some cells glitch on a given step
      const dx=on?Math.round((hs(gx,gy,fr+911)*2-1)*am):0,
            dy=on?Math.round((hs(gx,gy,fr+577)*2-1)*am*.35):0;
      mx.drawImage(src,sx0,sy0,w,h2,sx0+dx,sy0+dy,w,h2);
    }
    return M;
  }
  if(m=='Float'||m=='Breathe'){
    M.width=W;M.height=H;mx.save();
    if(m=='Float')mx.translate(0,Math.sin(p)*.05*H*k);
    else{mx.translate(W/2,H/2);const z=1+.12*k*Math.sin(p);mx.scale(z,z);mx.translate(-W/2,-H/2)}
    mx.drawImage(src,0,0);mx.restore();return M;
  }
  return src;
}
function render(){
  const W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  if(v.bgon){ctx.fillStyle=v.bg;ctx.fillRect(0,0,W,H)}
  for(const l of L){
    if(!l.vis)continue;Object.assign(v,l.fx);
    const p=6.2832*v.acy*tt/v.adu,k=v.aam/100,m=v.amv;
    if(m=='Rotating light')v.bang=(l.fx.bang+p*57.3)%360;
    SRC=xform(l.c,p,k,m,l);
    if(v.shon){ctx.save();const a=v.sha*Math.PI/180;ctx.shadowColor=rgba(v.shc,v.sho/100);ctx.shadowBlur=v.shb;ctx.shadowOffsetX=-Math.cos(a)*v.shd;ctx.shadowOffsetY=Math.sin(a)*v.shd;ctx.drawImage(SRC,0,0);ctx.restore()}
    else ctx.drawImage(SRC,0,0);
    if(v.bevon)bevel(W,H);
  }
  Object.assign(v,L[A].fx);
}
function smooth(h,W,H,r){ // separable running-sum box blur, run twice
  let a=h,b=new Float32Array(W*H);
  for(let pass=0;pass<2;pass++){
    for(let y=0;y<H;y++){const o=y*W;let s=0;
      for(let x=0;x<=r&&x<W;x++)s+=a[o+x];
      for(let x=0;x<W;x++){b[o+x]=s/(Math.min(W-1,x+r)-Math.max(0,x-r)+1);
        const ad=x+r+1,rm=x-r;if(ad<W)s+=a[o+ad];if(rm>=0)s-=a[o+rm]}}
    for(let x=0;x<W;x++){let s=0;
      for(let y=0;y<=r&&y<H;y++)s+=b[y*W+x];
      for(let y=0;y<H;y++){a[y*W+x]=s/(Math.min(H-1,y+r)-Math.max(0,y-r)+1);
        const ad=y+r+1,rm=y-r;if(ad<H)s+=b[ad*W+x];if(rm>=0)s-=b[rm*W+x]}}
  }
  return a;
}
function bevel(W,H){
  const t=v.btype,sz=v.bsize*(t=='Pillow'?1.6:1);
  tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,H);
  tx.filter=`blur(${sz/2}px)`;tx.drawImage(SRC,0,0);tx.filter='none';
  const im=tx.getImageData(0,0,W,H),d=im.data;let h=new Float32Array(W*H);
  for(let i=0;i<h.length;i++)h[i]=d[i*4+3]/255;
  // the blurred alpha is only 8-bit, so the raw height field is stepped; two float box passes
  // remove that banding before the gradient is amplified by Depth
  h=smooth(h,W,H,Math.max(1,Math.round(sz/6)));
  const rr=Math.max(1,Math.round(sz/2.5)); // wide gradient: the slope is measured over the bevel, not over one pixel
  const an=v.bang*Math.PI/180,al=v.balt*Math.PI/180,
    L3=[Math.cos(an)*Math.cos(al),-Math.sin(an)*Math.cos(al),Math.sin(al)],
    sg=(v.bdir=='Up'?1:-1)*(t=='Pillow'?-1:1),k=sg*v.bdepth*sz/14,
    hc=hx(v.bhc),sc=hx(v.bsc),ho=v.bho/100,so=v.bso/100;
  for(let y=0;y<H;y++){
    const y0=Math.max(0,y-rr)*W,y1=Math.min(H-1,y+rr)*W,yr=(Math.min(H-1,y+rr)-Math.max(0,y-rr))||1;
    for(let x=0;x<W;x++){
      const xa=Math.max(0,x-rr),xb=Math.min(W-1,x+rr),xr=(xb-xa)||1,i=y*W+x,
        nx=-(h[y*W+xb]-h[y*W+xa])/xr*k,ny=-(h[y1+x]-h[y0+x])/yr*k,
        s=((nx*L3[0]+ny*L3[1]+L3[2])/Math.hypot(nx,ny,1)-L3[2])*2.2,
        a=1-Math.exp(-1.5*Math.abs(s)), // soft roll-off instead of a hard clip, so steep slopes keep their shading
        o=i*4,col=s>0?hc:sc;
      d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=a*(s>0?ho:so)*255;
    }
  }
  tx.putImageData(im,0,0);tx.globalCompositeOperation='destination-in';tx.drawImage(SRC,0,0);
  ctx.drawImage(T,0,0);
}

// brush
let last=null,pts=null;
function pos(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
// mirror: repeat each stamp through reflection transforms (Horizontal = across the vertical centre axis)
function stamp(x,y,r){
  const MT=[[1,0,0,1,0,0]],d=v.mdir[0];
  if(v.mir){if(d!='V')MT.push([-1,0,0,1,CW,0]);if(d!='H')MT.push([1,0,0,-1,0,CH]);if(d=='B')MT.push([-1,0,0,-1,CW,CH])}
  for(const m of MT){sx.setTransform(...m);stamp1(x,y,r)}
  sx.setTransform(1,0,0,1,0,0);
}
function updMir(){const d=v.mdir[0];$('#cw').className=v.mir?(d=='H'?'mh':d=='V'?'mv':'mh mv'):''}
function stamp1(x,y,r){
  const st=v.bst;sx.globalCompositeOperation=v.erase?'destination-out':'source-over';sx.fillStyle=v.col;
  if(st=='Square')sx.fillRect(x-r,y-r,r*2,r*2);
  else if(st=='Calligraphic'){sx.beginPath();sx.ellipse(x,y,r,r*.22,-.785,0,7);sx.fill()}
  else if(st=='Star'){const k=r*.71,i=k*.237;sx.beginPath();sx.moveTo(x-k,y-k);sx.lineTo(x,y-i);sx.lineTo(x+k,y-k);sx.lineTo(x+i,y);sx.lineTo(x+k,y+k);sx.lineTo(x,y+i);sx.lineTo(x-k,y+k);sx.lineTo(x-i,y);sx.closePath();sx.fill()}
  else{const hd=v.hard/100,g=sx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,rgba(v.col,1));g.addColorStop(Math.min(.999,hd),rgba(v.col,1));g.addColorStop(1,rgba(v.col,0));
    sx.fillStyle=g;sx.beginPath();sx.arc(x,y,r,0,7);sx.fill()}
}
function stroke(p){
  const r=v.size/2,st=Math.max(1,v.size*.12);
  if(!last)stamp(p[0],p[1],r);else{const dx=p[0]-last[0],dy=p[1]-last[1],n=Math.ceil(Math.hypot(dx,dy)/st);for(let i=1;i<=n;i++)stamp(last[0]+dx*i/n,last[1]+dy*i/n,r)}
  last=p;draw();
}
function swell(){ // narrow → wide → narrow over the whole stroke
  sx.globalCompositeOperation='source-over';sx.clearRect(0,0,CW,CH);sx.drawImage(snap,0,0);
  const r=v.size/2,cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=cum[cum.length-1],st=Math.max(1,v.size*.08);
  if(tot<1){stamp(pts[0][0],pts[0][1],r*.3);return}
  for(let i=1;i<pts.length;i++){const dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/st));
    for(let j=1;j<=n;j++){const u=(cum[i-1]+(cum[i]-cum[i-1])*j/n)/tot;stamp(pts[i-1][0]+dx*j/n,pts[i-1][1]+dy*j/n,Math.max(.6,r*Math.pow(Math.sin(Math.PI*u),.8)))}}
}
c.addEventListener('pointerdown',e=>{
  c.setPointerCapture(e.pointerId);last=null;const p=pos(e);push([L[A]]);
  if(v.bst=='Swell'){snap.width=CW;snap.height=CH;sn.drawImage(S,0,0);pts=[p];swell();draw()}else{pts=null;stroke(p)}
});
c.addEventListener('pointermove',e=>{if(!e.buttons)return;if(pts){pts.push(pos(e));swell();draw()}else stroke(pos(e))});
c.addEventListener('pointerup',()=>{last=null;pts=null});

// animation
const F=$('#F'),sc=$('#sc');let play=false,t0=0,busy=false;
const V=document.createElement('canvas'),vx=V.getContext('2d');
F.addEventListener('input',e=>{const t=e.target;if(!t.dataset.id)return;read(t);sync(t);draw()});
sc.oninput=()=>{tt=sc.value/1000*v.adu;$('#tm').value=tt.toFixed(1)+'s';draw()};
function loop(now){
  if(!play)return;const e=(now-t0)/1000;
  tt=e%v.adu;sc.value=tt/v.adu*1000;$('#tm').value=tt.toFixed(1)+'s';render();
  requestAnimationFrame(loop);
}
function go(){if(busy)return;play=true;t0=performance.now()-tt*1000;$('#pl').textContent='Pause';requestAnimationFrame(loop)}
function pause(){play=false;$('#pl').textContent='Play'}
$('#pl').onclick=()=>play?pause():go();

// video export: frames are rendered one by one at a fixed timestep (not wall clock),
// so slow effects (bevel) never drop frames or starve the encoder.
const FPS=30,sleep=ms=>new Promise(r=>setTimeout(r,ms));
function vframe(i){ // render frame i into V (even size, opaque background)
  tt=i/FPS;render();vx.fillStyle=v.bgon?v.bg:'#fff';vx.fillRect(0,0,V.width,V.height);vx.drawImage(c,0,0);
  sc.value=tt/v.adu*1000;$('#tm').value=tt.toFixed(1)+'s';
}
function save(blob,ext){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LUCIDFAX.'+ext;a.click()}
async function viaWebCodecs(nf,br,prog){
  if(!window.VideoEncoder||!window.Mp4Muxer)return false;
  const W=V.width,H=V.height;let cfg=null,kind;
  for(const[k,codec]of[['avc','avc1.640034'],['avc','avc1.640033'],['avc','avc1.4d0034'],['avc','avc1.42003e'],['vp9','vp09.00.51.08'],['av1','av01.0.16M.08']]){
    const c0={codec,width:W,height:H,bitrate:br,framerate:FPS,bitrateMode:'variable',latencyMode:'quality',...(k=='avc'?{avc:{format:'avc'}}:{})};
    try{if((await VideoEncoder.isConfigSupported(c0)).supported){cfg=c0;kind=k;break}}catch(e){}
  }
  if(!cfg)return false;
  const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:kind,width:W,height:H,frameRate:FPS},fastStart:'in-memory'});
  let err=null;const enc=new VideoEncoder({output:(ch,m)=>mux.addVideoChunk(ch,m),error:e=>err=e});
  enc.configure(cfg);
  for(let i=0;i<nf;i++){
    vframe(i);
    const fr=new VideoFrame(V,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(fr,{keyFrame:i%FPS==0});fr.close();
    while(enc.encodeQueueSize>2&&!err)await sleep(1);
    if(err)throw err;prog(i/nf);await sleep(0);
  }
  await enc.flush();enc.close();if(err)throw err;mux.finalize();
  save(new Blob([mux.target.buffer],{type:'video/mp4'}),'mp4');return true;
}
async function viaRecorder(nf,br,prog){ // fallback when WebCodecs is unavailable: one requestFrame per rendered frame
  const mt=window.MediaRecorder&&['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  if(!mt){alert('Video recording is not supported in this browser');return}
  const st=V.captureStream(0),tr=st.getVideoTracks()[0],ch=[];
  const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:br});
  rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  vframe(0);rec.start();
  for(let i=0;i<nf;i++){
    if(i){rec.pause();vframe(i);rec.resume()} // paused time is not counted, so slow frames don't stretch the video
    tr.requestFrame?tr.requestFrame():st.requestFrame();prog(i/nf);
    const t=performance.now()+1000/FPS;while(performance.now()<t)await sleep(Math.max(1,t-performance.now()));
  }
  rec.stop();await done;save(new Blob(ch,{type:mt}),mt.includes('mp4')?'mp4':'webm');
}
$('#vx').onclick=async()=>{
  if(busy)return;pause();busy=true;const b=$('#vx'),keep=tt;
  V.width=c.width+(c.width&1);V.height=c.height+(c.height&1); // H.264 needs even sizes
  const nf=Math.max(1,Math.round(v.adu*FPS)),br=Math.round(Math.min(80e6,Math.max(16e6,V.width*V.height*FPS*.4)));
  const prog=f=>b.textContent='Exporting '+Math.round(f*100)+'%';
  try{if(!await viaWebCodecs(nf,br,prog))await viaRecorder(nf,br,prog)}
  catch(e){console.error(e);try{await viaRecorder(nf,br,prog)}catch(e2){alert('Video export failed: '+e2.message)}}
  busy=false;b.textContent='Export video';tt=keep;sc.value=tt/v.adu*1000;$('#tm').value=tt.toFixed(1)+'s';draw();
};

// UI
P.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.id)return;read(t);sync(t);
  if(t.dataset.id=='pre'&&PRE[v.pre]){P.querySelector('[data-id=w]').value=v.w=PRE[v.pre][0];P.querySelector('[data-id=h]').value=v.h=PRE[v.pre][1]}
  else if(t.dataset.id=='w'||t.dataset.id=='h')P.querySelector('[data-id=pre]').value=v.pre='Custom';
  updMir();draw();
});
$('#ap').onclick=()=>push(L)||resize(Math.min(4096,Math.max(16,v.w|0)),Math.min(4096,Math.max(16,v.h|0)));
$('#clr').onclick=()=>{if(confirm('Clear all layers?')){push(L);L.forEach(l=>l.x.clearRect(0,0,CW,CH));draw()}};
$('#ex').onclick=()=>{
  render();const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d'),f=v.fmt;
  if(f!='PNG'){x.fillStyle=v.bgon?v.bg:'#fff';x.fillRect(0,0,o.width,o.height)}
  x.drawImage(c,0,0);const n='LUCIDFAX';
  const dl=(u,e)=>{const a=document.createElement('a');a.href=u;a.download=n+'.'+e;a.click()};
  if(f=='PNG')o.toBlob(b=>dl(URL.createObjectURL(b),'png'));
  else if(f=='JPG')o.toBlob(b=>dl(URL.createObjectURL(b),'jpg'),'image/jpeg',.95);
  else{const{jsPDF}=window.jspdf,w=o.width,h=o.height,p=new jsPDF({unit:'px',format:[w,h],orientation:w>h?'l':'p',hotfixes:['px_scaling']});
    p.addImage(o.toDataURL('image/jpeg',.95),'JPEG',0,0,w,h);p.save(n+'.pdf')}
};
document.querySelectorAll('#th button').forEach(b=>b.onclick=()=>{
  document.documentElement.dataset.theme=b.dataset.t;
  document.querySelectorAll('#th button').forEach(x=>x.classList.toggle('on',x==b))});
$('#th button').classList.add('on');
resize(1080,1080);updMir();
</script></body></html>
